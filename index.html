<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz cumpleaños Roselys</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/styles.css?v=3" />
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button"
          aria-label="Cambiar a tema claro" aria-pressed="false">🌙</button>

  <!-- ============ ENTRANCE: falling birthday cake ============ -->
  <section id="entrance" class="entrance" aria-hidden="false">
    <div class="cake" id="cake">
      <!-- top tier -->
      <div class="tier tier-top">
        <span class="cherry"></span>
        <div class="candles">
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
          <div class="candle"><span class="flame"></span></div>
        </div>
      </div>
      <!-- middle tier -->
      <div class="tier tier-mid"></div>
      <!-- bottom tier -->
      <div class="tier tier-bottom"></div>
      <!-- plate -->
      <div class="plate"></div>
    </div>

    <h1 id="headline" class="headline">Feliz cumpleaños Roselys!</h1>

    <!-- ============ PHOTO BOOTH ============ -->
    <section id="booth" class="booth" aria-label="Máquina de fotos">
      <div class="machine" aria-hidden="true">
        <div class="machine-body">
          <div class="machine-screen">MÁQUINA DE FOTOS</div>
          <div class="slot"></div>
        </div>
      </div>
      <div class="printer-window" aria-label="Tira de fotos">
        <div id="strip" class="strip" role="list"></div>
      </div>
    </section>
  </section>

  <!-- Load order matters: data (photos.js) BEFORE logic (main.js) -->
  <script src="assets/photos.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
